services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: coophabitat
      POSTGRES_USER: coophabitat
      POSTGRES_PASSWORD: coophabitat
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/coophabitat
      DB_USER: coophabitat
      DB_PASSWORD: coophabitat
      CORS_ALLOWED_ORIGINS: http://localhost:4200
volumes:
  pgdata: